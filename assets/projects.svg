<svg xmlns="http://www.w3.org/2000/svg" width="900" height="652" viewBox="0 0 900 652" role="img" aria-label="Project deck: new open-source releases A.L.I.S.H.A. offline AI voice assistant and HushType private voice typing; Modern Web Application Security book in progress (11 of 24 chapters), offensive security knowledge base with 739 notes, NEXUS family command deck shipped, 21-challenge CTF portfolio shipped, plus Learning-Repos, Vault-Sync, a web game and pentest checklists">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.6" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#131a3a"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" x2="1"><stop offset="0" stop-color="#ffb547"/><stop offset="1" stop-color="#ffd08a"/></linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#5cc8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5cc8ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1d2a4d" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <style>
      .mono { font-family: Consolas, 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .card { fill: #0b1226; fill-opacity: 0.82; stroke: #1d2a4d; stroke-width: 1; }
      .title { font-size: 15px; font-weight: 700; fill: #e6edf3; letter-spacing: 0.5px; }
      .tag { font-size: 10px; letter-spacing: 1.2px; }
      .txt { font-size: 12px; fill: #a8b5cf; }
      .big { font-size: 34px; font-weight: 700; }
      .small { font-size: 11px; fill: #8b98b5; }
    </style>
  </defs>

  <rect width="900" height="652" rx="14" fill="url(#bg)"/>
  <rect width="900" height="652" rx="14" fill="url(#grid)"/>
  <rect x="-220" y="0" width="220" height="652" fill="url(#scan)">
    <animate attributeName="x" from="-220" to="900" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Header -->
  <text x="30" y="38" class="mono" font-size="15" fill="#00e5a0">$ ./projects --status</text>
  <rect x="218" y="26" width="9" height="16" fill="#00e5a0">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="870" y="38" class="mono small" text-anchor="end">2 in progress · 8 shipped · updated Nov 2026</text>

  <!-- Row 0: new open-source releases -->
  <!-- Card E: ALISHA -->
  <rect x="30" y="56" width="410" height="168" rx="10" class="card"/>
  <path d="M30 74V56H48 M422 56H440V74 M440 206V224H422 M48 224H30V206" fill="none" stroke="#2de0c8" stroke-width="2"/>
  <circle cx="54" cy="80" r="5" fill="#2de0c8"><animate attributeName="opacity" values="1;0.25;1" dur="1.4s" begin="0.2s" repeatCount="indefinite"/></circle>
  <text x="66" y="84" class="mono tag" fill="#2de0c8">OPEN SOURCE · SHIPPED NOV 2026</text>
  <rect x="384" y="70" width="40" height="18" rx="9" fill="#2de0c8" fill-opacity="0.15" stroke="#2de0c8"/>
  <text x="404" y="83" class="mono tag" fill="#2de0c8" text-anchor="middle">NEW</text>
  <text x="50" y="110" class="sans title">🛰️ A.L.I.S.H.A. · Offline AI Assistant</text>
  <text x="50" y="132" class="sans txt">Voice assistant with a holographic HUD on a Raspberry</text>
  <text x="50" y="148" class="sans txt">Pi 5 (Kali Linux) and custom ESP32-S3 firmware</text>
  <text x="50" y="174" class="sans txt">Whisper + Piper run locally: no cloud, no API keys</text>
  <text x="50" y="190" class="sans txt">Hardened: least privilege, CRC-checked serial link</text>
  <text x="50" y="212" class="sans small">C (ESP-IDF 5.4 · LVGL 9) · Python · Shell · Apache-2.0</text>

  <!-- Card F: HushType -->
  <rect x="460" y="56" width="410" height="168" rx="10" class="card"/>
  <path d="M460 74V56H478 M852 56H870V74 M870 206V224H852 M478 224H460V206" fill="none" stroke="#ff9cb0" stroke-width="2"/>
  <circle cx="484" cy="80" r="5" fill="#ff9cb0"><animate attributeName="opacity" values="1;0.25;1" dur="1.4s" begin="0.55s" repeatCount="indefinite"/></circle>
  <text x="496" y="84" class="mono tag" fill="#ff9cb0">OPEN SOURCE · SHIPPED NOV 2026</text>
  <rect x="814" y="70" width="40" height="18" rx="9" fill="#ff9cb0" fill-opacity="0.15" stroke="#ff9cb0"/>
  <text x="834" y="83" class="mono tag" fill="#ff9cb0" text-anchor="middle">NEW</text>
  <text x="480" y="110" class="sans title">🎙️ HushType · Private Voice Typing</text>
  <text x="480" y="132" class="sans txt">Hold a key, talk naturally, and clean text types</text>
  <text x="480" y="148" class="sans txt">into any app: terminal, browser, editor or chat</text>
  <text x="480" y="174" class="sans txt">whisper.cpp runs locally: nothing leaves the machine</text>
  <text x="480" y="190" class="sans txt">Drops fillers and spoken corrections · tested rules</text>
  <text x="480" y="212" class="sans small">Python · whisper.cpp · Unix-socket API · Apache-2.0</text>

  <g transform="translate(0,182)">
  <!-- Card A: Book (in progress) -->
  <rect x="30" y="56" width="410" height="168" rx="10" class="card"/>
  <path d="M30 74V56H48 M422 56H440V74 M440 206V224H422 M48 224H30V206" fill="none" stroke="#ffb547" stroke-width="2"/>
  <circle cx="54" cy="80" r="5" fill="#ffb547"><animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <text x="66" y="84" class="mono tag" fill="#ffb547">BOOK · IN PROGRESS</text>
  <text x="50" y="110" class="sans title">📘 Modern Web Application Security</text>
  <text x="50" y="132" class="sans txt">24-chapter hands-on book: fixed and vulnerable code</text>
  <text x="50" y="148" class="sans txt">side by side, every claim backed by a running lab</text>
  <text x="50" y="176" class="mono small">CHAPTERS</text>
  <rect x="118" y="167" width="250" height="10" rx="5" fill="#1a2446"/>
  <rect x="118" y="167" width="115" height="10" rx="5" fill="url(#gAmber)" filter="url(#glow)">
    <animate attributeName="width" from="0" to="115" dur="1.6s" begin="0.3s" fill="freeze"/>
  </rect>
  <text x="378" y="177" class="mono small" fill="#ffd08a">11 / 24</text>
  <text x="50" y="206" class="sans small">10 labs · Python · Node.js · Next.js · Angular · Laravel · Spring</text>

  <!-- Card B: Knowledge base (active) -->
  <rect x="460" y="56" width="410" height="168" rx="10" class="card"/>
  <path d="M460 74V56H478 M852 56H870V74 M870 206V224H852 M478 224H460V206" fill="none" stroke="#00e5a0" stroke-width="2"/>
  <circle cx="484" cy="80" r="5" fill="#00e5a0"><animate attributeName="opacity" values="1;0.25;1" dur="1.4s" begin="0.35s" repeatCount="indefinite"/></circle>
  <text x="496" y="84" class="mono tag" fill="#00e5a0">OBSIDIAN VAULT · ACTIVE</text>
  <text x="480" y="110" class="sans title">🧠 Offensive Security Knowledge Base</text>
  <text x="480" y="160" class="sans big" fill="#00e5a0" filter="url(#glow)">739</text>
  <text x="556" y="143" class="sans txt">notes across 12+ domains</text>
  <text x="556" y="160" class="sans txt">AD · Red Team · Cloud · Wi-Fi · Mobile</text>
  <text x="480" y="186" class="sans txt">OSCP practice · AI learning · books · POC write-ups</text>
  <text x="480" y="206" class="sans small">Auto-synced to GitHub by my Vault-Sync tool (Win · macOS · Linux)</text>

  <!-- Card C: NEXUS (shipped) -->
  <rect x="30" y="238" width="410" height="168" rx="10" class="card"/>
  <path d="M30 256V238H48 M422 238H440V256 M440 388V406H422 M48 406H30V388" fill="none" stroke="#5cc8ff" stroke-width="2"/>
  <circle cx="54" cy="262" r="5" fill="#5cc8ff"/>
  <text x="66" y="266" class="mono tag" fill="#5cc8ff">SHIPPED · NOV 2026</text>
  <text x="50" y="292" class="sans title">⬡ NEXUS · Family Command Deck</text>
  <text x="50" y="314" class="sans txt">Always-on family hub that turns an old Android</text>
  <text x="50" y="330" class="sans txt">tablet into a wall display: calendars, alerts, weather</text>
  <text x="50" y="356" class="sans txt">Panchang engine: 40+ festivals computed on-device</text>
  <text x="50" y="388" class="sans small">One HTML file · Google Apps Script backend · zero dependencies</text>

  <!-- Card D: CTF portfolio (shipped) -->
  <rect x="460" y="238" width="410" height="168" rx="10" class="card"/>
  <path d="M460 256V238H478 M852 238H870V256 M870 388V406H852 M478 406H460V388" fill="none" stroke="#c792ea" stroke-width="2"/>
  <circle cx="484" cy="262" r="5" fill="#c792ea"/>
  <text x="496" y="266" class="mono tag" fill="#c792ea">SHIPPED · 2020 – 2025</text>
  <text x="480" y="292" class="sans title">🚩 CTF Challenge Portfolio</text>
  <text x="480" y="342" class="sans big" fill="#c792ea" filter="url(#glow)">21</text>
  <text x="530" y="325" class="sans txt">original challenges for live events</text>
  <text x="530" y="342" class="sans txt">Web · Forensics · Crypto · RE · Binary</text>
  <text x="480" y="370" class="sans txt">Shipped as Flask apps, C binaries and Docker labs</text>
  <text x="480" y="388" class="sans small">See section 04 for every challenge by year</text>

  <!-- Also shipped strip -->
  <rect x="30" y="420" width="840" height="34" rx="8" class="card"/>
  <text x="48" y="442" class="mono tag" fill="#00e5a0">ALSO SHIPPED ▸</text>
  <text x="160" y="442" class="sans txt">Learning-Repos sync (27 projects kept current) · Vault-Sync · Tic-Tac-Toe web game · Pentest checklists</text>
  </g>
</svg>
